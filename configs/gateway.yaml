# Local-only demo. Routes preserve the original path and query.
server:
  listen: 127.0.0.1:8080
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  request_timeout: 20s
  shutdown_timeout: 25s
  max_body_bytes: 4194304

transport:
  dial_timeout: 3s
  response_header_timeout: 5s
  idle_conn_timeout: 60s
  max_idle_conns: 128
  max_idle_conns_per_host: 32
  max_conns_per_host: 128

upstreams:
  demo:
    - http://127.0.0.1:18081
    - http://127.0.0.1:18082

routes:
  - id: demo
    path_prefix: /
    upstream: demo
